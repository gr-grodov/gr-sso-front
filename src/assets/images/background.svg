<svg width="100%" height="100%" viewBox="0 0 1920 1080"
     xmlns="http://www.w3.org/2000/svg">

    <defs>
        <!-- Основной градиент -->
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f6c7d9"/>
            <stop offset="35%" stop-color="#b9a8e5"/>
            <stop offset="70%" stop-color="#9dbff0"/>
            <stop offset="100%" stop-color="#6ec7df"/>
        </linearGradient>

        <!-- Размытие -->
        <filter id="blur">
            <feGaussianBlur stdDeviation="70"/>
        </filter>

        <!-- Точки -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="3"/>
        </filter>
    </defs>


    <!-- Фон -->
    <rect width="1920" height="1080" fill="url(#bg)"/>

    <ellipse cx="300" cy="250" rx="500" ry="350"
             fill="#ffb8d5"
             opacity="0.45"
             filter="url(#blur)"/>

    <ellipse cx="1400" cy="500" rx="600" ry="400"
             fill="#5faeea"
             opacity="0.35"
             filter="url(#blur)"/>

    <g fill="#ffffff" opacity="0.08">

        <polygon points="
      800,180
      1050,100
      1200,300
      950,420"/>

        <polygon points="
      1200,300
      1500,250
      1700,500
      1400,650"/>

        <polygon points="
      500,500
      800,300
      950,600
      650,800"/>

        <polygon points="
      1400,650
      1700,500
      1900,800
      1500,950"/>

    </g>

    <g id="points" fill="white">
        <circle cx="240" cy="120" r="4"/>
        <circle cx="120" cy="170" r="4"/>
        <circle cx="360" cy="240" r="4"/>
        <circle cx="220" cy="320" r="4"/>
        <circle cx="100" cy="360" r="4"/>
        <circle cx="500" cy="320" r="4"/>
        <circle cx="600" cy="160" r="4"/>
        <circle cx="360" cy="500" r="4"/>
        <circle cx="320" cy="700" r="4"/>
    </g>

    <g stroke="white"
       stroke-width="1"
       opacity=".45"
       fill="none"
    >

        <line x1="240" y1="120"
              x2="120" y2="170"/>

        <line x1="120" y1="170"
              x2="360" y2="240"/>

        <line x1="360" y1="240"
              x2="600" y2="160"/>

        <line x1="600" y1="160"
              x2="500" y2="320"/>

        <line x1="100" y1="360"
              x2="220" y2="320"/>

        <line x1="220" y1="320"
              x2="360" y2="500"/>

        <line x1="360" y1="500"
              x2="320" y2="700"/>
    </g>

    <g stroke="#fff"
       stroke-width="0.8"
       opacity="0.45"
       fill="none">

        <!-- Верх -->
        <path d="M980 60 L1080 120 L1170 70 L1270 "/>
        <path d="M1080 120 L1030 240 L1170 220 "/>
        <path d="M1390 100 L1450 260 L1620 120"/>
        <path d="M1760 180 L1820 320"/>

        <!-- Центр -->
        <path d="M760 260 L910 320 L1010"/>
        <path d="M910 320 L820 480 L980 560 L1120 390"/>
        <path d="M1260 520"/>

        <!-- Левый низ -->
        <path d="M220 760 L360 620 L520 700 L470 870"/>
        <path d="M360 620 L440 500 L520 700"/>
        <path d="M520 700 L720 820 L840 720"/>

    </g>

    <g fill="#fff">

        <!-- Верх -->
        <circle cx="980" cy="60" r="4"/>
        <circle cx="1080" cy="120" r="4"/>
        <circle cx="1170" cy="70" r="4"/>
        <circle cx="1030" cy="240" r="4"/>
        <circle cx="1170" cy="220" r="4"/>

        <!-- Центр -->
        <circle cx="760" cy="260" r="4"/>
        <circle cx="910" cy="320" r="4"/>
        <circle cx="1010" cy="420" r="4"/>
        <circle cx="1120" cy="390" r="4"/>
        <circle cx="820" cy="480" r="4"/>

        <!-- Левый низ -->
        <circle cx="220" cy="760" r="4"/>
        <circle cx="360" cy="620" r="4"/>
        <circle cx="440" cy="500" r="4"/>
        <circle cx="520" cy="700" r="4"/>
        <circle cx="470" cy="870" r="4"/>
        <circle cx="720" cy="820" r="4"/>
        <circle cx="840" cy="720" r="4"/>

    </g>

</svg>